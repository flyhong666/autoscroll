name: Build & Release APK

# 触发条件：
#   1. 推送 v* 格式的 tag（如 v3.0.0、v3.1.0-beta）
#   2. 发布 Release
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch: # 支持手动触发（用于调试）

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 上传 APK 到 Release 需要
    # 通过 job env 把 secret 是否配置暴露给 if 判断
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 解密正式签名 keystore（仅当仓库配置了 SIGNING_KEYSTORE_BASE64 secret 时执行）
      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 提取版本号 + 重命名 APK（合并为一步，全用 shell 变量，避免跨步骤表达式插值）
      - name: Extract version and rename APK
        id: version
        shell: bash
        run: |
          mkdir -p output
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG=""
            VERSION="dev-${SHORT_SHA}"
          fi
          # 防止文件名包含路径分隔符
          VERSION="${VERSION//\//-}"
          # 用 shell 变量拷贝（不经过 ${{ }} 插值，规避 secret 脱敏干扰）
          cp app/build/outputs/apk/release/app-release.apk \
             "output/autoscroll-${VERSION}.apk"
          ls -la output/
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag=$TAG)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoscroll-${{ steps.version.outputs.version }}
          path: output/*.apk
          retention-days: 30

      # 仅 release 事件触发时上传到 GitHub Release
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true

      # tag 推送但无 release 时，自动创建一个 release 并附带 APK
      - name: Create Release with APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}
