name: Build & Release APK

# 触发条件：
#   1. 推送 v* 格式的 tag（如 v3.0.0、v3.1.0-beta）
#   2. 发布 Release
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch: # 支持手动触发

env:
  GRADLE_OPTS: "-Dorg.gradle.caching=true"

# 同一分支/标签的旧构建自动取消，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 上传 APK 到 Release 需要
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 解密正式签名 keystore
      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 从 app/build.gradle.kts 提取 versionName 并处理 APK 命名
      - name: Extract version and rename APK
        id: version
        shell: bash
        run: |
          mkdir -p output
          SHORT_SHA="${GITHUB_SHA::7}"

          GRADLE_VERSION=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*["'\''"]([^"'\''"]+)["'\''"].*/\1/p' app/build.gradle.kts | head -n 1)

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="${GRADLE_VERSION:-dev-${SHORT_SHA}}"
            TAG="v${VERSION}"
          fi

          VERSION_CLEAN="${VERSION//\//-}"

          # 统一输出名为 release 包，不再追加 -debug 后缀
          cp app/build/outputs/apk/release/app-release.apk \
             "output/autoscroll-${VERSION_CLEAN}.apk"
          ls -la output/

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_CLEAN" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION_CLEAN (tag=$TAG)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoscroll-${{ steps.version.outputs.version }}
          path: output/*.apk
          retention-days: 30

      # 仅 release 事件触发时上传到 GitHub Release
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true
          prerelease: false

      # tag 推送但无 release 时，自动创建一个正式 Release 并附带 APK
      - name: Create Release with APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      # 手动 Run workflow：自动创建正式 Release
      - name: Create Manual Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automated APK release build from GitHub Actions.

            Workflow run: #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
