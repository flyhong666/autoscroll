name: Build & Release APK

# 触发条件：
#   1. 推送 v* 格式的 tag（如 v3.0.0、v3.1.0-beta）
#   2. 发布 Release
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch: # 支持手动触发（用于调试）

env:
  GRADLE_OPTS: "-Dorg.gradle.caching=true"

# 同一分支/标签的旧构建自动取消，避免排队堆积
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 上传 APK 到 Release 需要
    # 通过 job env 把 secret 是否配置暴露给 if 判断
    env:
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17：AGP 9.3 要求 JDK >= 17，Gradle 9.6.1 在 17 上兼容性最稳；
      # 本地 JDK 25 可继续用（Gradle 9.6 已支持），CI 用 17 规避工具链兼容风险
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---- 质量门禁：单元测试 + Lint（在 release 构建前拦截编译/逻辑错误）----
      # testDebugUnitTest 会编译 main + test 源码，能提前暴露类似
      # `Unresolved reference 'Build'` 这种导入遗漏问题，避免等到 assembleRelease 才失败。
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # lintDebug 生成 HTML/XML 报告；首期非阻断（abortOnError=false），
      # 仅上传报告让问题可见，待历史告警清理后再改为强制阻断。
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          retention-days: 14

      # 解密正式签名 keystore（仅当仓库配置了 SIGNING_KEYSTORE_BASE64 secret 时执行）
      - name: Decode signing keystore
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 提取版本号 + 重命名 APK（合并为一步，全用 shell 变量，避免跨步骤表达式插值）
      - name: Extract version and rename APK
        id: version
        shell: bash
        run: |
          mkdir -p output
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG=""
            VERSION="dev-${SHORT_SHA}"
          fi
          # 防止文件名包含路径分隔符
          VERSION="${VERSION//\//-}"
          # 无正式签名时自动回退 debug 签名：文件名加 -debug 标注，
          # 避免用户把 debug 包误当正式包安装（debug 包无法覆盖升级正式签名包）
          if [[ "$HAS_KEYSTORE" == "true" ]]; then SUFFIX=""; else SUFFIX="-debug"; fi
          # 用 shell 变量拷贝（不经过工作流表达式插值，规避 secret 脱敏干扰）
          cp app/build/outputs/apk/release/app-release.apk \
             "output/autoscroll-${VERSION}${SUFFIX}.apk"
          ls -la output/
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag=$TAG, signed=$HAS_KEYSTORE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoscroll-${{ steps.version.outputs.version }}
          path: output/*.apk
          retention-days: 30

      # 仅 release 事件触发时上传到 GitHub Release
      - name: Attach APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          generate_release_notes: true

      # tag 推送但无 release 时，自动创建一个 release 并附带 APK
      - name: Create Release with APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}

      # 手动 Run workflow：自动创建独立 Release 并附带 APK
      # 使用 workflow run number 作为唯一 tag，避免与正式版本号冲突
      - name: Create Manual Release with APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-build-${{ github.run_number }}
          name: Manual Build ${{ github.run_number }}
          body: |
            Automated APK build from GitHub Actions.

            Workflow run: #${{ github.run_number }}
            Commit: ${{ github.sha }}
          files: output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: true
