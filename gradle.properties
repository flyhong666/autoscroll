# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 并行构建：多模块/多任务时可明显提速（AGP 9 默认支持）
org.gradle.parallel=true
# configuration-cache 收益小、风险大（本机复用守护进程场景易踩坑），暂不开启
org.gradle.configuration-cache=false
# 禁用 toolchain 自动下载（使用本地 JDK）
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
# 注意：本文件不再包含机器级环境 hack（如 org.gradle.daemon=false）。
# 若某台机器需要关闭守护进程 / 调整内存，请写到本机用户级配置
# ~/.gradle/gradle.properties 或项目根的 local.properties，不要提交进仓库。

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
